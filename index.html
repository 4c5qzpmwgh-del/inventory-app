<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤Nico時尚魔法屋❤ 
    <br>雲端即時庫存系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen">

  <!-- 權限不足提示 -->
  <div id="unauthorized" class="hidden max-w-md mx-auto mt-20 bg-white p-6 rounded-xl shadow text-center">
    <div class="text-rose-500 text-4xl mb-3">⚠️</div>
    <h2 class="text-xl font-bold mb-2">未授權存取</h2>
    <p class="text-sm text-slate-500">此頁面僅供持有專屬分享連結的人員使用，請向管理員索取正確連結。</p>
  </div>

  <!-- 主要應用程式 -->
  <div id="app" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-100">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Nico 時尚魔法屋 線上庫存管理</h1>
        <p class="text-xs text-slate-400 mt-1">服裝穿搭與道具分類庫存</p>
      </div>
      <div id="sync-status" class="flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-amber-50 text-amber-600 border border-amber-200">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        連線中...
      </div>
    </div>

    <!-- 新增品項表單 -->
    <form id="add-form" class="mt-6 bg-slate-50 p-4 rounded-xl border border-slate-200/60 flex flex-col gap-4">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input type="text" id="name" placeholder="品項名稱 (必填)" required 
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        <input type="text" id="sku" placeholder="型號 / 條碼 (選填)" 
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        <input type="number" id="qty" placeholder="初始庫存" required min="0" value="0" 
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
      </div>
      
      <!-- 分類選擇區（點選標籤） -->
      <div>
        <span class="text-xs font-semibold text-slate-500 block mb-2">選擇分類：</span>
        <div id="category-selector" class="flex flex-wrap gap-2">
          <!-- 由 JS 動態生成分類選項標籤 -->
        </div>
      </div>

      <!-- 照片上傳與提交區 -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2 border-t border-slate-200/60">
        <div class="w-full sm:w-auto flex items-center gap-2">
          <label class="cursor-pointer bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 shadow-sm">
            <span>📷 選擇圖片</span>
            <input type="file" id="image-file" accept="image/*" class="hidden">
          </label>
          <span id="file-name" class="text-xs text-slate-400 truncate max-w-xs">未選擇照片</span>
        </div>
        <button type="submit" id="submit-btn"
          class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-medium py-2 px-6 rounded-lg text-sm transition shadow-sm">
          ＋ 新增項目
        </button>
      </div>
    </form>

    <!-- 列表分類篩選選項 -->
    <div class="mt-8 mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">庫存分類篩選</span>
        <span id="filter-count" class="text-xs text-slate-400">共 0 項</span>
      </div>
      <div id="filter-container" class="flex flex-wrap gap-1.5">
        <!-- 由 JS 動態生成篩選按鈕 -->
      </div>
    </div>

    <!-- 庫存列表 -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-200 text-slate-400 text-xs tracking-wider uppercase">
            <th class="py-3 px-4 font-semibold w-16">圖片</th>
            <th class="py-3 px-4 font-semibold">品名</th>
            <th class="py-3 px-4 font-semibold">分類</th>
            <th class="py-3 px-4 font-semibold">型號 / 條碼</th>
            <th class="py-3 px-4 font-semibold text-center w-44">即時庫存</th>
            <th class="py-3 px-4 font-semibold text-right">操作</th>
          </tr>
        </thead>
        <tbody id="inventory-list" class="divide-y divide-slate-100 text-sm">
          <tr>
            <td colspan="6" class="py-8 text-center text-slate-400">載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 設定區
    // ==========================================
    const SUPABASE_URL = 'https://cgqloctrxtiwxywyhxgr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNncWxvY3RyeHRpd3h5d3loeGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNTU3MzcsImV4cCI6MjEwOTYzMTczN30.Hwm1vx-FzTt3BXMqyTD6wMozI3l74XdzNxw_qiszyZM';
    const ACCESS_KEY = 'iLTWzzNR1yqaWLey';

    // 定義 10 個指定分類
    const CATEGORIES = [
      '日常穿搭',
      '正式穿搭',
      '節慶穿搭',
      '春節',
      '中秋節',
      '端午節',
      '萬聖節',
      '聖誕節',
      '動畫',
      'cosplay'
    ];

    let selectedCategory = CATEGORIES[0]; // 預設新增品項的分類
    let currentFilter = 'ALL';             // 預設篩選所有項目

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('key') !== ACCESS_KEY) {
      document.getElementById('app').classList.add('hidden');
      document.getElementById('unauthorized').classList.remove('hidden');
      throw new Error('未授權存取');
    }

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let inventoryData = [];

    // 初始化分類標籤 UI
    function initCategoryUI() {
      // 1. 生成新增表單的分類按鈕
      const selectorEl = document.getElementById('category-selector');
      selectorEl.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = cat;
        btn.onclick = () => selectFormCategory(cat);
        btn.className = `cat-btn px-3 py-1 rounded-lg text-xs font-medium border transition ${
          cat === selectedCategory 
            ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
            : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
        }`;
        selectorEl.appendChild(btn);
      });

      // 2. 生成篩選按鈕
      const filterEl = document.getElementById('filter-container');
      filterEl.innerHTML = '';
      
      const filterOptions = ['ALL', ...CATEGORIES];
      filterOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = opt === 'ALL' ? '全部' : opt;
        btn.onclick = () => setTableFilter(opt);
        btn.className = `filter-btn px-3 py-1 rounded-full text-xs font-medium border transition ${
          opt === currentFilter 
            ? 'bg-slate-800 text-white border-slate-800' 
            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-200'
        }`;
        filterEl.appendChild(btn);
      });
    }

    function selectFormCategory(cat) {
      selectedCategory = cat;
      initCategoryUI();
    }

    function setTableFilter(cat) {
      currentFilter = cat;
      initCategoryUI();
      renderTable();
    }

    // 檔案選取名稱切換
    document.getElementById('image-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      document.getElementById('file-name').innerText = file ? file.name : '未選擇照片';
    });

    async function fetchInventory() {
      const { data, error } = await client
        .from('inventory')
        .select('*')
        .order('updated_at', { ascending: false });

      if (error) {
        console.error('抓取資料失敗:', error);
        return;
      }
      inventoryData = data || [];
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('inventory-list');
      tbody.innerHTML = '';

      // 依照分類過濾
      const filteredData = currentFilter === 'ALL' 
        ? inventoryData 
        : inventoryData.filter(item => item.category === currentFilter);

      document.getElementById('filter-count').innerText = `顯示 ${filteredData.length} / 共 ${inventoryData.length} 項`;

      if (filteredData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">目前分類無任何品項</td></tr>`;
        return;
      }

      filteredData.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition duration-150';

        const imgHtml = item.image_url 
          ? `<img src="${escapeHtml(item.image_url)}" class="w-10 h-10 object-cover rounded-md border border-slate-200">`
          : `<div class="w-10 h-10 bg-slate-100 rounded-md border border-slate-200 flex items-center justify-center text-slate-300 text-xs">無圖</div>`;

        tr.innerHTML = `
          <td class="py-3 px-4">${imgHtml}</td>
          <td class="py-3 px-4 font-medium text-slate-800">${escapeHtml(item.item_name)}</td>
          <td class="py-3 px-4">
            <span class="inline-block px-2 py-0.5 rounded text-xs bg-slate-100 text-slate-600 border border-slate-200 font-medium">
              ${escapeHtml(item.category || '未分類')}
            </span>
          </td>
          <td class="py-3 px-4 text-slate-500 font-mono text-xs">${escapeHtml(item.sku || '-')}</td>
          <td class="py-3 px-4 text-center">
            <div class="inline-flex items-center justify-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
              <button onclick="changeQty('${item.id}', ${item.quantity - 1})" class="w-7 h-7 flex items-center justify-center rounded bg-white hover:bg-slate-200 text-slate-700 font-bold shadow-sm transition">-</button>
              
              <input type="number" min="0" value="${item.quantity}" 
                onchange="handleManualQtyChange('${item.id}', this.value)"
                class="w-16 text-center font-bold text-slate-800 text-sm bg-white border border-slate-200 rounded px-1 py-0.5 focus:outline-none focus:ring-1 focus:ring-blue-500">
              
              <button onclick="changeQty('${item.id}', ${item.quantity + 1})" class="w-7 h-7 flex items-center justify-center rounded bg-white hover:bg-slate-200 text-slate-700 font-bold shadow-sm transition">+</button>
            </div>
          </td>
          <td class="py-3 px-4 text-right">
            <button onclick="deleteItem('${item.id}')" class="text-rose-500 hover:text-rose-700 font-medium text-xs px-2 py-1 rounded hover:bg-rose-50 transition">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function handleManualQtyChange(id, val) {
      const num = parseInt(val, 10);
      if (isNaN(num) || num < 0) {
        fetchInventory();
        return;
      }
      await updateDbQty(id, num);
    }

    async function changeQty(id, newQty) {
      if (newQty < 0) return;
      await updateDbQty(id, newQty);
    }

    async function updateDbQty(id, newQty) {
      inventoryData = inventoryData.map(i => i.id === id ? { ...i, quantity: newQty } : i);
      renderTable();

      const { error } = await client.from('inventory').update({ quantity: newQty }).eq('id', id);
      if (error) {
        console.error('更新失敗:', error);
        fetchInventory();
      }
    }

    async function deleteItem(id) {
      if (!confirm('確定要刪除這筆品項嗎？')) return;
      inventoryData = inventoryData.filter(i => i.id !== id);
      renderTable();

      const { error } = await client.from('inventory').delete().eq('id', id);
      if (error) {
        console.error('刪除失敗:', error);
        fetchInventory();
      }
    }

    // 新增品項（含分類與圖片上傳）
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const nameInput = document.getElementById('name');
      const skuInput = document.getElementById('sku');
      const qtyInput = document.getElementById('qty');
      const fileInput = document.getElementById('image-file');

      submitBtn.disabled = true;
      submitBtn.innerText = '處理中...';

      let uploadedImageUrl = null;

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

          const { data: uploadData, error: uploadError } = await client.storage
            .from('inventory-images')
            .upload(fileName, file);

          if (uploadError) throw uploadError;

          const { data: urlData } = client.storage
            .from('inventory-images')
            .getPublicUrl(fileName);

          uploadedImageUrl = urlData.publicUrl;
        }

        const newItem = {
          item_name: nameInput.value.trim(),
          category: selectedCategory, // 儲存點選的分類
          sku: skuInput.value.trim() || null,
          quantity: parseInt(qtyInput.value, 10) || 0,
          image_url: uploadedImageUrl
        };

        const { error: insertError } = await client.from('inventory').insert([newItem]);
        if (insertError) throw insertError;

        nameInput.value = '';
        skuInput.value = '';
        qtyInput.value = '0';
        fileInput.value = '';
        document.getElementById('file-name').innerText = '未選擇照片';

      } catch (err) {
        alert('新增失敗: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '＋ 新增項目';
      }
    });

    function setOnlineStatus(isOnline) {
      const statusEl = document.getElementById('sync-status');
      if (isOnline) {
        statusEl.className = 'flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200';
        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 即時連線同步中';
      } else {
        statusEl.className = 'flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-amber-50 text-amber-600 border border-amber-200';
        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> 重新連線中...';
      }
    }

    function initRealtime() {
      client
        .channel('realtime_inventory_feed')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, payload => {
          if (payload.eventType === 'INSERT') {
            if (!inventoryData.some(i => i.id === payload.new.id)) {
              inventoryData.unshift(payload.new);
            }
          } else if (payload.eventType === 'UPDATE') {
            inventoryData = inventoryData.map(item => item.id === payload.new.id ? payload.new : item);
          } else if (payload.eventType === 'DELETE') {
            inventoryData = inventoryData.filter(item => item.id !== payload.old.id);
          }
          renderTable();
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            setOnlineStatus(true);
          }
        });

      // 自動備援輪詢（保證多端絕對同步）
      setInterval(() => {
        fetchInventory();
        setOnlineStatus(true);
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // 啟動
    initCategoryUI();
    fetchInventory().then(() => setOnlineStatus(true));
    initRealtime();
  </script>
</body>
</html>
